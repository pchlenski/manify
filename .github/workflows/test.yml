name: Test & Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

# Pin a stable Hugging Face cache root for every job/step. `datasets`/`huggingface_hub`
# resolve their cache under $HF_HOME, so fixing it here guarantees the path we cache with
# actions/cache is exactly the path the library reads/writes. Relying on the platform default
# (~/.cache/huggingface) is fragile and silently breaks if the default ever changes.
env:
  HF_HOME: ${{ github.workspace }}/.hf_cache

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false    # don’t stop the matrix if one Python version fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"] # jaxtyping requires >= 3.10

    steps:
      # Setup and installation
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Restore the Hugging Face dataset cache. test_embedders / test_curvature_estimation
      # call load_hf, so even this job needs the datasets. Key is stable across runs but
      # versioned by the dataset list so adding/removing datasets invalidates it.
      - name: Cache HuggingFace datasets
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ runner.os }}-huggingface-${{ hashFiles('tests/conftest.py', 'tests/test_utils.py') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      # On a cache hit, run datasets fully offline so load_dataset serves from the restored
      # cache with zero network round-trips (no per-dataset revision check, no Hub rate limits).
      # On a miss we stay online so the run can download and populate the cache for next time.
      - name: Enable HuggingFace offline mode on cache hit
        if: steps.hf-cache.outputs.cache-hit == 'true'
        run: |
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          echo "HF_DATASETS_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Smoke‑test pip install manify
        run: |
          python - <<EOF
          import manify
          print("manify version:", getattr(manify, "__version__", "unknown"))
          EOF

      # Code quality checks with Ruff
      - name: Check code formatting and linting with Ruff
        run: |
          ruff check manify/
          ruff format --check manify/

      # Pre-commit hooks validation
      - name: Run pre-commit hooks
        run: |
          pre-commit run --files manify/**/*.py || true

      # Type checking
      - name: Check type annotations with MyPy
        run: mypy manify/

      # Unit testing
      - name: Run unit tests & collect coverage (except dataloaders)
        run: pytest tests --cov --cov-report=xml -k "not test_dataloaders"


      # Code coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          flags: unittests
          name: python-${{ matrix.python-version }}

  # Dataloaders run in parallel, for speed
  test-dataloaders:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace datasets
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ runner.os }}-huggingface-${{ hashFiles('tests/conftest.py', 'tests/test_utils.py') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: Enable HuggingFace offline mode on cache hit
        if: steps.hf-cache.outputs.cache-hit == 'true'
        run: |
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          echo "HF_DATASETS_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run dataloader tests
        run: pytest tests/test_utils.py::test_dataloaders -v --cov=manify/dataloaders --cov-report=xml

      # Upload dataloader coverage separately
      - name: Upload dataloader coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          flags: dataloaders
          name: dataloaders
